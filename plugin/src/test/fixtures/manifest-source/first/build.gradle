// Force the dependency to finish evaluation before applying XmlClassGuard.
evaluationDependsOn(':lib')
apply plugin: 'com.android.application'
apply plugin: 'xml-class-guard'
android {
    namespace = "fixture.${project.name}"
    compileSdk = 37
    sourceSets.main.manifest.srcFile('custom/main.xml')
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.manifests.addStaticManifestFile('custom/additional.xml')
}

xmlClassGuard {
    findAndConstraintReferencedIds = true
    findAabConstraintReferencedIds = true
}
// Match resource plugins that register tasks after AGP's onVariants callback.
afterEvaluate {
    ['Debug', 'Release'].each { variant ->
        tasks.register("resguard${variant}")
        tasks.register("aabresguard${variant}")
    }
}

dependencies { implementation projects.lib }
